<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BNI FutureZ – Member Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── Reset ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#c8102e;--red-dark:#9b0d23;--red-glow:rgba(200,16,46,.15);
  --gold:#f5a623;--gold-lt:#ffd480;
  --dark:#ffffff;--dark2:#f7f7f8;--dark3:#eeeeef;--dark4:#e2e2e4;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);
  --text:#1a1a1a;--muted:#6b6b6b;--muted2:#4a4a4a;
  --green:#16a34a;--green-bg:rgba(22,163,74,.08);--green-border:rgba(22,163,74,.28);
  --amber:#b45309;--amber-bg:rgba(180,83,9,.08);--amber-border:rgba(180,83,9,.28);
  --danger:#dc2626;--danger-bg:rgba(220,38,38,.08);--danger-border:rgba(220,38,38,.28);
  --blue:#1d4ed8;--blue-bg:rgba(29,78,216,.08);--blue-border:rgba(29,78,216,.28);
  --r:10px;--shadow:0 4px 24px rgba(0,0,0,.1);
}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 50% at 0% 0%,rgba(200,16,46,.04) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 100% 100%,rgba(200,16,46,.03) 0%,transparent 60%);pointer-events:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--dark3)}::-webkit-scrollbar-thumb{background:var(--red-dark);border-radius:3px}
.hidden{display:none!important}

/* ══ LOGIN ═══════════════════════════════════════════════════ */
#login-page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.login-wrap{width:100%;max-width:420px;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-card{background:var(--dark2);border:1px solid var(--border);border-top:3px solid var(--red);border-radius:var(--r);padding:2.75rem 2.25rem 2.25rem;box-shadow:var(--shadow),0 0 40px rgba(200,16,46,.08)}
.login-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-bottom:2rem}
.login-logo-wrap img{width:88px;height:auto;filter:drop-shadow(0 4px 12px rgba(200,16,46,.4))}
.login-chapter{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2)}
.login-period{font-size:.72rem;letter-spacing:.06em;color:var(--muted);margin-top:.1rem}
.login-divider{height:1px;background:var(--border);margin-bottom:1.75rem}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:.4rem}
.form-group input{width:100%;background:#fff;border:1px solid var(--border2);border-radius:7px;padding:.72rem 1rem;font-family:'Barlow',sans-serif;font-size:.95rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-glow)}
.form-group input::placeholder{color:var(--muted)}
.login-hint{font-size:.75rem;color:var(--muted);text-align:center;margin-bottom:1.5rem;line-height:1.6}
.login-hint b{color:var(--muted2)}
.btn-login{width:100%;background:var(--red);color:#fff;border:none;border-radius:7px;padding:.82rem;font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:background .2s,box-shadow .2s,transform .1s}
.btn-login:hover{background:var(--red-dark);box-shadow:0 4px 24px var(--red-glow)}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-error{background:var(--danger-bg);border:1px solid var(--danger-border);border-radius:7px;padding:.65rem 1rem;font-size:.86rem;color:#991b1b;margin-bottom:1rem;text-align:center}

/* ══ APP SHELL ════════════════════════════════════════════════ */
#app-shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ── Topnav ────────────────────────────────────────────────── */
.topnav{background:#fff;border-bottom:1px solid var(--border2);padding:0 1.75rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.topnav-l{display:flex;align-items:center;gap:.9rem}
.topnav-logo{height:34px;width:auto;filter:drop-shadow(0 2px 6px rgba(200,16,46,.3))}
.topnav-info{display:flex;flex-direction:column}
.topnav-chapter{font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);line-height:1}
.topnav-period{font-size:.68rem;color:var(--muted);margin-top:.15rem}
.topnav-r{display:flex;align-items:center;gap:.75rem}
.user-chip{display:flex;align-items:center;gap:.5rem;background:var(--dark3);border:1px solid var(--border2);border-radius:20px;padding:.3rem .85rem .3rem .35rem}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.75rem;color:#fff;flex-shrink:0}
.uname{font-size:.85rem;font-weight:500}
.btn-logout{background:transparent;border:1px solid var(--border);border-radius:6px;padding:.35rem .8rem;font-family:'Barlow',sans-serif;font-size:.78rem;color:var(--muted);cursor:pointer;transition:all .2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* ── Main ──────────────────────────────────────────────────── */
.main{flex:1;padding:1.75rem;max-width:1280px;margin:0 auto;width:100%}

/* ── Page header ───────────────────────────────────────────── */
.pg-header{margin-bottom:1.75rem}
.pg-header h1{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;line-height:1;letter-spacing:.02em}
.pg-header .pg-sub{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.period-badge{display:inline-flex;align-items:center;gap:.35rem;background:var(--blue-bg);border:1px solid var(--blue-border);border-radius:20px;padding:.2rem .75rem;font-size:.72rem;color:var(--blue);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:.5rem}

/* ── Alerts ────────────────────────────────────────────────── */
.alerts-wrap{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.5rem}
.alert{display:flex;align-items:flex-start;gap:.7rem;border-radius:var(--r);padding:.9rem 1.1rem;font-size:.88rem;line-height:1.5;animation:fadeDown .4s ease both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.alert-icon{font-size:1.15rem;flex-shrink:0;margin-top:.05rem}
.alert-text strong{display:block;margin-bottom:.1rem;font-weight:600}
.alert-danger{background:var(--danger-bg);border:1px solid var(--danger-border);color:#991b1b}
.alert-warning{background:var(--amber-bg);border:1px solid var(--amber-border);color:#92400e}
.alert-success{background:var(--green-bg);border:1px solid var(--green-border);color:#14532d}
.alert-info{background:var(--blue-bg);border:1px solid var(--blue-border);color:#1e3a8a}

/* ── Overall status pill ───────────────────────────────────── */
.status-pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:var(--r);padding:1rem 1.5rem;margin-bottom:1.5rem;font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.status-pill.good{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.status-pill.risk{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber)}
.status-pill.critical{background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--danger-bg)}50%{box-shadow:0 0 0 6px transparent}}

/* ── Benchmarks ────────────────────────────────────────────── */
.section-label{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.bench-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;margin-bottom:1.75rem}
.bench-card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem 1.2rem .95rem;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.bench-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.bench-card.met{border-top:3px solid var(--green)}
.bench-card.unmet{border-top:3px solid var(--danger)}
.bc-badge{position:absolute;top:1rem;right:1rem;font-size:1.1rem}
.bc-label{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.bc-numbers{display:flex;align-items:baseline;gap:.35rem;margin-bottom:.15rem}
.bc-val{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;font-weight:800;line-height:1}
.bench-card.met .bc-val{color:var(--green)}
.bench-card.unmet .bc-val{color:var(--danger)}
.bc-target{font-size:.8rem;color:var(--muted)}
.bc-sub{font-size:.75rem;color:var(--muted);margin-bottom:.6rem}
.bc-bar{height:4px;background:var(--dark4);border-radius:2px;overflow:hidden}
.bc-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bench-card.met .bc-fill{background:var(--green)}
.bench-card.unmet .bc-fill{background:var(--danger)}

/* ── Attendance summary ────────────────────────────────────── */
.attend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem;margin-bottom:1.75rem}
.att-card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.2rem;position:relative}
.att-label{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.att-val{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;color:var(--text)}
.att-sub{font-size:.75rem;color:var(--muted);margin-top:.15rem}
.att-card.ok .att-val{color:var(--green)}
.att-card.warn .att-val{color:var(--amber)}
.att-card.bad .att-val{color:var(--danger)}

/* Limit bar */
.limit-track{height:6px;background:var(--dark4);border-radius:3px;overflow:hidden;margin-top:.6rem}
.limit-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.ok-fill{background:var(--green)} .warn-fill{background:var(--amber)} .bad-fill{background:var(--danger)}
.limit-text{font-size:.7rem;color:var(--muted);margin-top:.25rem}

/* ── Stats grid ────────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.75rem;margin-bottom:1.75rem}
.stat-card{background:var(--dark3);border:1px solid var(--border);border-radius:8px;padding:.9rem 1rem;text-align:center;transition:transform .15s,border-color .15s}
.stat-card:hover{transform:translateY(-1px);border-color:var(--border2)}
.sc-label{font-size:.67rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem;line-height:1.3}
.sc-val{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:700;color:var(--text)}
.sc-sub{font-size:.67rem;color:var(--muted);margin-top:.1rem}

/* ══ ADMIN VIEW ═══════════════════════════════════════════════ */
.admin-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.25rem}
.search-input{background:#fff;border:1px solid var(--border2);border-radius:7px;padding:.6rem 1rem;font-family:'Barlow',sans-serif;font-size:.88rem;color:var(--text);outline:none;width:260px;transition:border-color .2s}
.search-input:focus{border-color:var(--red)}
.search-input::placeholder{color:var(--muted)}
.filter-tabs{display:flex;gap:.4rem}
.ftab{background:#fff;border:1px solid var(--border2);border-radius:6px;padding:.38rem .85rem;font-size:.78rem;font-weight:600;color:var(--muted2);cursor:pointer;transition:all .15s;white-space:nowrap}
.ftab:hover{border-color:var(--red);color:var(--text)}
.ftab.active{background:var(--red);border-color:var(--red);color:#fff}

/* Admin summary bar */
.admin-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem;margin-bottom:1.5rem}
.as-card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;text-align:center}
.as-val{font-family:'Barlow Condensed',sans-serif;font-size:1.85rem;font-weight:800}
.as-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.15rem}
.as-card.good .as-val{color:var(--green)}
.as-card.bad  .as-val{color:var(--danger)}
.as-card.warn .as-val{color:var(--amber)}
.as-card.info .as-val{color:var(--text)}

/* Admin table */
.tbl-wrap{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 290px);border-radius:var(--r);border:1px solid var(--border2)}
table{width:100%;border-collapse:collapse;font-size:.83rem;white-space:nowrap}
thead{background:var(--dark3);position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08)}
thead th{padding:.75rem .9rem;text-align:left;font-size:.67rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);border-bottom:2px solid var(--border2);cursor:pointer;user-select:none;transition:color .15s;background:var(--dark3)}
thead th:hover{color:var(--text)}
thead th.sort-asc::after{content:' ↑';color:var(--red)}
thead th.sort-desc::after{content:' ↓';color:var(--red)}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s}
tbody tr:hover{background:rgba(0,0,0,.025)}
tbody tr:last-child{border-bottom:none}
td{padding:.65rem .9rem;vertical-align:middle}
td.name-cell{font-weight:600;color:var(--text)}
td.name-cell span{display:block;font-size:.7rem;color:var(--muted);font-weight:400}

.tag{display:inline-flex;align-items:center;border-radius:4px;padding:.15rem .5rem;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag-good{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.tag-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.tag-bad{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.tag-info{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}

.num-cell{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700}
.num-cell.good{color:var(--green)}
.num-cell.bad{color:var(--danger)}
.num-cell.warn{color:var(--amber)}

/* Member detail modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-box{background:#fff;border:1px solid var(--border2);border-radius:var(--r);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
.modal-header h2{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800}
.btn-close{background:transparent;border:1px solid var(--border);border-radius:6px;padding:.35rem .7rem;color:var(--muted);cursor:pointer;font-size:1rem;transition:all .15s}
.btn-close:hover{border-color:var(--red);color:var(--red)}
.modal-body{padding:1.5rem}

/* ── Loading spinner ───────────────────────────────────────── */
.loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:4rem;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Responsive ────────────────────────────────────────────── */
@media(max-width:640px){
  .main{padding:1rem}
  .topnav{padding:0 1rem}
  .topnav-chapter,.topnav-period{display:none}
  .bench-grid,.attend-grid{grid-template-columns:1fr 1fr}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .admin-controls{flex-direction:column;align-items:stretch}
  .search-input{width:100%}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════ LOGIN PAGE ═══════════════════════════════ -->
<div id="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo-wrap">
        <img src="bni.png" alt="BNI" onerror="this.style.display='none';document.getElementById('bni-text-fallback').style.display='block'"/>
        <div id="bni-text-fallback" style="display:none;font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900;color:var(--red);letter-spacing:.1em">BNI</div>
        <div class="login-chapter">FutureZ Chapter</div>
        <div class="login-period">📅 6-Month Rolling Performance Portal</div>
      </div>
      <div class="login-divider"></div>
      <div id="login-error" class="login-error hidden"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-user" placeholder="Enter your first name" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Enter your last name" autocomplete="current-password"/>
      </div>
      <p class="login-hint">Username = <b>First Name</b> &nbsp;|&nbsp; Password = <b>Last Name</b><br/>Not case sensitive</p>
      <button class="btn-login" id="btn-login" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════ APP SHELL ════════════════════════════════ -->
<div id="app-shell" class="hidden">
  <nav class="topnav">
    <div class="topnav-l">
      <img src="bni.png" class="topnav-logo" alt="BNI" onerror="this.outerHTML='<span style=\'font-family:Barlow Condensed,sans-serif;font-size:1.3rem;font-weight:900;color:var(--red);letter-spacing:.08em\'>BNI</span>'"/>
      <div class="topnav-info">
        <span class="topnav-chapter">FutureZ Chapter</span>
        <span class="topnav-period">6-Month Rolling Data</span>
      </div>
    </div>
    <div class="topnav-r">
      <div class="user-chip">
        <div class="avatar" id="nav-avatar">?</div>
        <span class="uname" id="nav-uname">—</span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>

  <div class="main">
    <!-- MEMBER DASHBOARD -->
    <div id="member-view" class="hidden"></div>
    <!-- ADMIN DASHBOARD -->
    <div id="admin-view" class="hidden"></div>
    <!-- LOADER -->
    <div id="loader" class="loader-wrap hidden">
      <div class="spinner"></div>
      <span>Loading data…</span>
    </div>
  </div>
</div>

<!-- ADMIN MEMBER MODAL -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modal-title">Member Detail</h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG – paste your deployed Apps Script URL here
// ═══════════════════════════════════════════════════════════════
const API_URL = "https://script.google.com/macros/s/AKfycbz3gNJ9OjxclSHkWCu-X1o6KX2p5rdJX71FMKX1pplWcZdt5qiSgBsaLhy_Fv1cLCrt3w/exec";

// ── State ──────────────────────────────────────────────────────
let currentRole = null;
let currentUser = null;
let allMembersCache = [];
let sortCol = null, sortDir = 1;
let activeFilter = "all";

// ── JSONP fetch (bypasses CORS) ────────────────────────────────
function apiFetch(params) {
  return new Promise((resolve, reject) => {
    const cbName = "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    const qs = Object.entries({ ...params, callback: cbName })
      .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&");
    const script = document.createElement("script");
    script.src = API_URL + "?" + qs;
    window[cbName] = (data) => {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.onerror = () => {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error("Network error – check your API URL"));
    };
    document.body.appendChild(script);
    setTimeout(() => {
      if (window[cbName]) {
        delete window[cbName];
        try { document.body.removeChild(script); } catch(e) {}
        reject(new Error("Request timed out"));
      }
    }, 15000);
  });
}

// ── Login ──────────────────────────────────────────────────────
document.getElementById("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
document.getElementById("login-user").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const user = document.getElementById("login-user").value.trim();
  const pass = document.getElementById("login-pass").value.trim();
  const errEl = document.getElementById("login-error");
  const btn   = document.getElementById("btn-login");

  if (!user || !pass) { showLoginErr("Please enter both username and password."); return; }
  errEl.classList.add("hidden");
  btn.disabled = true; btn.textContent = "Signing in…";

  try {
    const res = await apiFetch({ action: "login", username: user, password: pass });
    if (!res.success) { showLoginErr(res.error || "Invalid credentials."); return; }
    currentRole = res.role;
    currentUser = res.role === "admin" ? { fullName: "Admin", firstName: "Admin" } : res.data;
    launchApp();
  } catch(e) {
    showLoginErr("Connection failed: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Sign In";
  }
}

function showLoginErr(msg) {
  const el = document.getElementById("login-error");
  el.textContent = msg; el.classList.remove("hidden");
}

// ── App launch ─────────────────────────────────────────────────
function launchApp() {
  document.getElementById("login-page").classList.add("hidden");
  document.getElementById("app-shell").classList.remove("hidden");
  const initials = currentUser.firstName.slice(0,2).toUpperCase();
  document.getElementById("nav-avatar").textContent = initials;
  document.getElementById("nav-uname").textContent = currentRole === "admin" ? "Admin" : currentUser.fullName;

  if (currentRole === "admin") renderAdmin();
  else renderMember(currentUser);
}

function doLogout() {
  currentRole = null; currentUser = null; allMembersCache = [];
  document.getElementById("app-shell").classList.add("hidden");
  document.getElementById("login-page").classList.remove("hidden");
  document.getElementById("login-user").value = "";
  document.getElementById("login-pass").value = "";
  document.getElementById("login-error").classList.add("hidden");
  document.getElementById("member-view").innerHTML = "";
  document.getElementById("admin-view").innerHTML = "";
}

// ═══════════════════════════════════════════════════════════════
// MEMBER DASHBOARD
// ═══════════════════════════════════════════════════════════════
function renderMember(m) {
  document.getElementById("member-view").classList.remove("hidden");
  document.getElementById("admin-view").classList.add("hidden");
  document.getElementById("member-view").innerHTML = buildMemberHTML(m);
  // animate progress bars after paint
  requestAnimationFrame(() => animateBars(m));
}

function buildMemberHTML(m) {
  const alerts = buildAlerts(m);
  return `
  <div class="pg-header">
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
      <h1>👋 ${m.fullName}</h1>
      ${statusPill(m)}
    </div>
    <div class="pg-sub">Your performance metrics · <span class="period-badge">📅 6-Month Rolling</span></div>
  </div>

  ${alerts}

  <div class="section-label">📊 Membership Minimums</div>
  <div class="bench-grid">
    ${benchCard("Total Referrals", m.totalReferrals, 20, "RGI + RGO", m.benchmarks.referrals.met)}
    ${benchCard("Testimonials", m.testimonials, 2, "T", m.benchmarks.testimonials.met)}
    ${benchCard("Visitors Brought", m.visitors, 2, "V", m.benchmarks.visitors.met)}
    ${benchCard("Trainings", m.trainings, 2, "", m.benchmarks.trainings.met)}
  </div>

  <div class="section-label">🗓 Attendance &amp; Substitutes</div>
  <div class="attend-grid">
    ${attCard("Present", m.present, "", "neutral")}
    ${attCard("Absent", m.absent, `Max allowed: ${m.maxAbsent}`, m.absent > m.maxAbsent ? "bad" : m.absent === m.maxAbsent ? "warn" : "ok")}
    ${attCard("Substitutes", m.substitutes, "", "ok")}
    ${attCard("Late", m.late, "", "neutral")}
    ${attCard("Medical Leave", m.medLeave, "", "neutral")}
    ${attAllowance(m)}
  </div>

  <div class="section-label">🤝 Referral Activity</div>
  <div class="stats-grid">
    ${statCard("RGI", m.rgi, "Referrals Given Inside")}
    ${statCard("RGO", m.rgo, "Referrals Given Outside")}
    ${statCard("RRI", m.rri, "Referrals Received Inside")}
    ${statCard("RRO", m.rro, "Referrals Received Outside")}
    ${statCard("Total Referrals", m.totalReferrals, "RGI + RGO")}
  </div>

`;
}

function statusPill(m) {
  if (m.membershipStatus === "CRITICAL")
    return `<span class="status-pill critical">🚨 Membership Critical</span>`;
  if (m.membershipStatus === "AT RISK")
    return `<span class="status-pill risk">⚠️ At Risk</span>`;
  return `<span class="status-pill good">✅ Good Standing</span>`;
}

function buildAlerts(m) {
  let html = '<div class="alerts-wrap">';

  // ── 1. Membership Minimums status (completely separate from substitute) ──
  if (m.allBenchmarksMet) {
    html += alert("success","🏆","All Membership Minimums Met!",`Great job, ${m.firstName}! You've met all 4 Membership Minimums this 6-month period. You're allowed up to <strong>9 absences+substitutes</strong> with max 3 absents.`);
    // Minimums complete: warn at 8, limit reached at 9, crossed above 9
    if (m.usedTotal > 9) {
      html += alert("danger","🚫","Absence Limit Crossed",`You have used <strong>${m.usedTotal} of 9</strong> allowed absent+substitute slots — the limit has been crossed. Your membership is at serious risk.`);
    } else if (m.usedTotal === 9) {
      html += alert("danger","🚨","Absence Limit Reached",`You have used <strong>${m.usedTotal} of 9</strong> allowed absent+substitute slots. You have reached the maximum limit.`);
    } else if (m.usedTotal >= 8) {
      html += alert("warning","⚠️","Approaching Absence Limit",`You've used <strong>${m.usedTotal} of 9</strong> allowed absent+substitute slots. One more will reach the limit.`);
    }
  } else {
    const unmet = [];
    if (!m.benchmarks.referrals.met)    unmet.push(`Referrals (${m.totalReferrals}/20)`);
    if (!m.benchmarks.testimonials.met) unmet.push(`Testimonials (${m.testimonials}/2)`);
    if (!m.benchmarks.visitors.met)     unmet.push(`Visitors (${m.visitors}/2)`);
    if (!m.benchmarks.trainings.met)    unmet.push(`Trainings (${m.trainings}/2)`);
    // Minimums incomplete: warn at 5, limit reached at 6, crossed above 6
    if (m.usedTotal > 6) {
      html += alert("danger","🚫","Membership Minimums Incomplete – Limit Crossed",`Pending: <strong>${unmet.join(", ")}</strong>. You have used <strong>${m.usedTotal} of 6</strong> allowed absent+substitute slots — the limit while minimums are unmet has been crossed. Your membership is at serious risk.`);
    } else if (m.usedTotal === 6) {
      html += alert("danger","🚨","Membership Minimums Incomplete – Limit Reached",`Pending: <strong>${unmet.join(", ")}</strong>. You have used <strong>${m.usedTotal} of 6</strong> allowed absent+substitute slots. You have reached the maximum limit while minimums are unmet.`);
    } else if (m.usedTotal >= 5) {
      html += alert("warning","⚠️","Membership Minimums Incomplete – Approaching Limit",`Pending: <strong>${unmet.join(", ")}</strong>. You have used <strong>${m.usedTotal} of 6</strong> allowed absent+substitute slots. One more will reach the limit.`);
    }
  }

  // ── 2. Substitute alert — fully separate, based on usedTotal ──
  if (m.substituteAlert) {
    if (m.usedTotal > 9) {
      html += alert("danger","🚫","Substitute Alert – Limit Crossed",`You have used <strong>${m.usedTotal}</strong> absent+substitute slots this 6-month period — over the maximum. Please contact your chapter leadership immediately.`);
    } else if (m.usedTotal === 9) {
      html += alert("danger","🚨","Substitute Alert – Limit Reached",`You have used <strong>${m.usedTotal}</strong> absent+substitute slots this 6-month period. You've reached the maximum. Please review with your chapter leadership.`);
    } else if (m.usedTotal >= 8) {
      html += alert("warning","⚠️","Substitute Alert",`You have used <strong>${m.usedTotal}</strong> absent+substitute slots this 6-month period. Please review your substitute usage with your chapter leadership.`);
    }
  }

  // ── 3. Absent count exceeded ──
  if (m.absentOverLimit) {
    html += alert("danger","🔴","Absent Count Exceeded",`You have <strong>${m.absent} absents</strong>, exceeding the maximum of 3 allowed. This is a serious concern for membership.`);
  }

  html += '</div>';
  return html;
}

function alert(type, icon, title, body) {
  return `<div class="alert alert-${type}"><span class="alert-icon">${icon}</span><div class="alert-text"><strong>${title}</strong>${body}</div></div>`;
}

function benchCard(label, value, target, sub, met) {
  const pct = Math.min((value / target) * 100, 100);
  return `
  <div class="bench-card ${met ? 'met' : 'unmet'}">
    <div class="bc-badge">${met ? '✅' : '❌'}</div>
    <div class="bc-label">${label}</div>
    <div class="bc-numbers">
      <span class="bc-val" data-val="${value}">0</span>
      <span class="bc-target">/ ${target}</span>
    </div>
    ${sub ? `<div class="bc-sub">${sub}</div>` : '<div class="bc-sub">&nbsp;</div>'}
    <div class="bc-bar"><div class="bc-fill" data-pct="${pct}" style="width:0%"></div></div>
  </div>`;
}

function attCard(label, value, sub, cls) {
  return `
  <div class="att-card ${cls}">
    <div class="att-label">${label}</div>
    <div class="att-val">${value}</div>
    ${sub ? `<div class="att-sub">${sub}</div>` : ''}
  </div>`;
}

function attAllowance(m) {
  const pct = Math.min((m.usedTotal / m.maxTotal) * 100, 100);
  const cls = m.overLimit ? "bad" : m.usedTotal >= m.maxTotal - 1 ? "warn" : "ok";
  const fillCls = m.overLimit ? "bad-fill" : m.usedTotal >= m.maxTotal - 1 ? "warn-fill" : "ok-fill";
  return `
  <div class="att-card ${cls}" style="grid-column:span 2">
    <div class="att-label">Substitute + Absent Allowance Used</div>
    <div class="att-val">${m.usedTotal} <span style="font-size:1rem;color:var(--muted)">/ ${m.maxTotal}</span></div>
    <div class="limit-track"><div class="limit-fill ${fillCls}" data-pct="${pct}" style="width:0%"></div></div>
    <div class="limit-text">Absent: ${m.absent} · Substitutes: ${m.substitutes} · Max absent: ${m.maxAbsent}</div>
  </div>`;
}

function statCard(label, value, sub) {
  return `
  <div class="stat-card">
    <div class="sc-label">${label}</div>
    <div class="sc-val">${value}</div>
    ${sub ? `<div class="sc-sub">${sub}</div>` : ''}
  </div>`;
}

function animateBars(m) {
  document.querySelectorAll(".bc-fill[data-pct]").forEach(el => {
    setTimeout(() => { el.style.width = el.dataset.pct + "%"; }, 100);
  });
  document.querySelectorAll(".limit-fill[data-pct]").forEach(el => {
    setTimeout(() => { el.style.width = el.dataset.pct + "%"; }, 150);
  });
  document.querySelectorAll(".bc-val[data-val]").forEach(el => {
    const target = parseInt(el.dataset.val);
    let cur = 0; const step = Math.ceil(target / 20);
    const iv = setInterval(() => {
      cur = Math.min(cur + step, target);
      el.textContent = cur;
      if (cur >= target) clearInterval(iv);
    }, 40);
  });
}

// ═══════════════════════════════════════════════════════════════
// ADMIN DASHBOARD
// ═══════════════════════════════════════════════════════════════
async function renderAdmin() {
  document.getElementById("member-view").classList.add("hidden");
  document.getElementById("admin-view").classList.remove("hidden");
  document.getElementById("loader").classList.remove("hidden");
  document.getElementById("admin-view").innerHTML = "";

  try {
    const res = await apiFetch({ action: "getAllMembers", username: "admin", password: "bnifuturz" });
    document.getElementById("loader").classList.add("hidden");
    if (!res.success) { document.getElementById("admin-view").innerHTML = `<div class="alert alert-danger"><span class="alert-icon">❌</span><div class="alert-text">${res.error}</div></div>`; return; }
    allMembersCache = res.data;
    buildAdminView(allMembersCache);
  } catch(e) {
    document.getElementById("loader").classList.add("hidden");
    document.getElementById("admin-view").innerHTML = `<div class="alert alert-danger"><span class="alert-icon">❌</span><div class="alert-text">Failed to load: ${e.message}</div></div>`;
  }
}

function buildAdminView(members) {
  const total   = members.length;
  const good    = members.filter(m => m.membershipStatus === "GOOD").length;
  const atRisk  = members.filter(m => m.membershipStatus === "AT RISK").length;
  const critical= members.filter(m => m.membershipStatus === "CRITICAL").length;
  const allBench= members.filter(m => m.allBenchmarksMet).length;
  const subAlert= members.filter(m => m.substituteAlert).length;

  document.getElementById("admin-view").innerHTML = `
  <div class="pg-header">
    <h1>Admin Dashboard</h1>
    <div class="pg-sub">All member performance · <span class="period-badge">📅 6-Month Rolling</span></div>
  </div>

  <div class="admin-sum">
    <div class="as-card info"><div class="as-val">${total}</div><div class="as-lbl">Total Members</div></div>
    <div class="as-card good"><div class="as-val">${good}</div><div class="as-lbl">Good Standing</div></div>
    <div class="as-card warn"><div class="as-val">${atRisk}</div><div class="as-lbl">At Risk</div></div>
    <div class="as-card bad"><div class="as-val">${critical}</div><div class="as-lbl">Critical</div></div>
    <div class="as-card good"><div class="as-val">${allBench}</div><div class="as-lbl">Membership Minimums Met</div></div>
    <div class="as-card bad"><div class="as-val">${subAlert}</div><div class="as-lbl">Substitute Alert</div></div>
  </div>

  <div class="admin-controls">
    <input type="text" class="search-input" id="admin-search" placeholder="🔍  Search by name…" oninput="filterTable()"/>
    <div class="filter-tabs">
      <button class="ftab active" onclick="setFilter('all',this)">All</button>
      <button class="ftab" onclick="setFilter('good',this)">Good</button>
      <button class="ftab" onclick="setFilter('risk',this)">At Risk</button>
      <button class="ftab" onclick="setFilter('critical',this)">Critical</button>
      <button class="ftab" onclick="setFilter('sub-alert',this)">Sub Alert</button>
      <button class="ftab" onclick="setFilter('bench-fail',this)">Min. Fail</button>
    </div>
  </div>

  <div class="tbl-wrap">
    <table id="admin-table">
      <thead>
        <tr>
          <th onclick="sortTable('fullName')">Member</th>
          <th onclick="sortTable('membershipStatus')">Status</th>
          <th onclick="sortTable('allBenchmarksMet')">Mem. Minimums</th>
          <th onclick="sortTable('totalReferrals')">Referrals</th>
          <th onclick="sortTable('testimonials')">T</th>
          <th onclick="sortTable('visitors')">V</th>
          <th onclick="sortTable('trainings')">Train</th>
          <th onclick="sortTable('oneToOne')">1-2-1</th>
          <th onclick="sortTable('absent')">Absent</th>
          <th onclick="sortTable('substitutes')">Subs</th>
          <th onclick="sortTable('usedTotal')">Used/Max</th>
          <th onclick="sortTable('tyfcb')">TYFCB</th>
          <th>Detail</th>
        </tr>
      </thead>
      <tbody id="admin-tbody"></tbody>
    </table>
  </div>`;

  renderAdminRows(members);
}

function renderAdminRows(members) {
  const tbody = document.getElementById("admin-tbody");
  if (!tbody) return;
  tbody.innerHTML = members.map(m => `
  <tr>
    <td class="name-cell">${m.fullName}</td>
    <td>${statusTag(m)}</td>
    <td>${m.allBenchmarksMet ? '<span class="tag tag-good">✅ Met</span>' : '<span class="tag tag-bad">❌ Min. Fail</span>'}</td>
    <td class="num-cell ${m.benchmarks.referrals.met?'good':'bad'}">${m.totalReferrals}<span style="color:var(--muted);font-size:.75rem">/20</span></td>
    <td class="num-cell ${m.benchmarks.testimonials.met?'good':'bad'}">${m.testimonials}</td>
    <td class="num-cell ${m.benchmarks.visitors.met?'good':'bad'}">${m.visitors}</td>
    <td class="num-cell ${m.benchmarks.trainings.met?'good':'bad'}">${m.trainings}</td>
    <td class="num-cell">${m.oneToOne}</td>
    <td class="num-cell ${m.absentOverLimit?'bad':m.absent===m.maxAbsent?'warn':'good'}">${m.absent}</td>
    <td class="num-cell">${m.substitutes}</td>
    <td class="num-cell ${m.overLimit || m.usedTotal >= (m.allBenchmarksMet ? 9 : 6) ? 'bad' : m.usedTotal >= (m.allBenchmarksMet ? 8 : 5) ? 'warn' : 'good'}">${m.usedTotal}/${m.maxTotal}</td>
    <td class="num-cell">${m.tyfcb}</td>
    <td><button onclick="showMemberModal('${m.firstName}')" style="background:#fff;border:1px solid var(--border2);color:var(--muted2);border-radius:5px;padding:.3rem .7rem;cursor:pointer;font-size:.78rem;transition:all .15s" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--muted2)'">View</button></td>
  </tr>`).join("");
}

function statusTag(m) {
  if (m.membershipStatus === "CRITICAL") return '<span class="tag tag-bad">🚨 Critical</span>';
  if (m.membershipStatus === "AT RISK")  return '<span class="tag tag-warn">⚠ At Risk</span>';
  return '<span class="tag tag-good">✅ Good</span>';
}

function filterTable() {
  const q = document.getElementById("admin-search").value.toLowerCase();
  let filtered = allMembersCache.filter(m => m.fullName.toLowerCase().includes(q));
  if (activeFilter === "good")       filtered = filtered.filter(m => m.membershipStatus === "GOOD");
  if (activeFilter === "risk")       filtered = filtered.filter(m => m.membershipStatus === "AT RISK");
  if (activeFilter === "critical")   filtered = filtered.filter(m => m.membershipStatus === "CRITICAL");
  if (activeFilter === "sub-alert")  filtered = filtered.filter(m => m.substituteAlert);
  if (activeFilter === "bench-fail") filtered = filtered.filter(m => !m.allBenchmarksMet);
  renderAdminRows(filtered);
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll(".ftab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  filterTable();
}

function sortTable(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  document.querySelectorAll("thead th").forEach(th => th.classList.remove("sort-asc","sort-desc"));
  const idx = ["fullName","membershipStatus","allBenchmarksMet","totalReferrals","testimonials","visitors","trainings","oneToOne","absent","substitutes","usedTotal","tyfcb"].indexOf(col);
  const ths = document.querySelectorAll("thead th");
  if (idx >= 0) ths[idx].classList.add(sortDir === 1 ? "sort-asc" : "sort-desc");
  const sorted = [...allMembersCache].sort((a,b) => {
    let va = a[col], vb = b[col];
    if (typeof va === "boolean") va = va ? 1 : 0;
    if (typeof vb === "boolean") vb = vb ? 1 : 0;
    if (typeof va === "string") return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });
  renderAdminRows(sorted);
}

// ── Member Detail Modal (Admin) ────────────────────────────────
function showMemberModal(firstName) {
  const m = allMembersCache.find(x => x.firstName === firstName);
  if (!m) return;
  document.getElementById("modal-title").textContent = m.fullName + " – Detail";
  document.getElementById("modal-body").innerHTML = buildMemberHTML(m);
  document.getElementById("modal-overlay").classList.remove("hidden");
  requestAnimationFrame(() => animateBars(m));
}

function closeModal(e) {
  if (!e || e.target === document.getElementById("modal-overlay")) {
    document.getElementById("modal-overlay").classList.add("hidden");
  }
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
</script>

</html>
